name: WorkSpec CI

on:
  pull_request:
    paths:
      - "packages/workspec/**"
      - "web/packages/workspec/**"
      - "web/workspec/**"
      - ".github/workflows/workspec-ci.yml"
  push:
    branches:
      - main
    paths:
      - "packages/workspec/**"
      - "web/packages/workspec/**"
      - "web/workspec/**"
      - ".github/workflows/workspec-ci.yml"

permissions:
  contents: read

jobs:
  test-packed-package:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Verify synced browser assets
        run: node packages/workspec/scripts/check-sync.js

      - name: Test WorkSpec
        working-directory: packages/workspec
        run: npm test

      - name: Pack the tested source
        id: pack
        working-directory: packages/workspec
        run: echo "tarball=$(npm pack --silent)" >> "$GITHUB_OUTPUT"

      - name: Smoke-test a clean tarball install
        env:
          WORKSPEC_TARBALL: ${{ github.workspace }}/packages/workspec/${{ steps.pack.outputs.tarball }}
        run: |
          install_dir="$(mktemp -d)"
          cd "$install_dir"
          npm init --yes >/dev/null
          npm install "$WORKSPEC_TARBALL"
          ./node_modules/.bin/workspec --version
          ./node_modules/.bin/workspec --help >/dev/null
