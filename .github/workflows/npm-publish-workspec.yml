name: Publish WorkSpec CLI (npm)

on:
  push:
    tags:
      - "workspec-v*"
  workflow_dispatch:
    inputs:
      version:
        description: Exact package version to publish (for example, 1.2.4)
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org"

      - name: Verify web assets in sync
        run: node packages/workspec/scripts/check-sync.js

      - name: Verify release version
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          package_version="$(node -p "require('./packages/workspec/package.json').version")"
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            test "$GITHUB_REF_NAME" = "workspec-v$package_version"
          else
            test "$DISPATCH_VERSION" = "$package_version"
          fi

      - name: Test WorkSpec
        working-directory: packages/workspec
        run: npm test

      - name: Pack tested source
        id: pack
        working-directory: packages/workspec
        run: echo "tarball=$(npm pack --silent)" >> "$GITHUB_OUTPUT"

      - name: Smoke-test clean tarball install
        env:
          WORKSPEC_TARBALL: ${{ github.workspace }}/packages/workspec/${{ steps.pack.outputs.tarball }}
        run: |
          install_dir="$(mktemp -d)"
          cd "$install_dir"
          npm init --yes >/dev/null
          npm install "$WORKSPEC_TARBALL"
          ./node_modules/.bin/workspec --version
          ./node_modules/.bin/workspec --help >/dev/null

      - name: Publish tested tarball
        env:
          WORKSPEC_TARBALL: ${{ github.workspace }}/packages/workspec/${{ steps.pack.outputs.tarball }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish "$WORKSPEC_TARBALL" --access public
